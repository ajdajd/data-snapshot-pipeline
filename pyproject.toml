[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "data-snapshot-pipeline"
version = "0.1.0"
description = "Production pipeline for extracting data snapshots and metadata"
requires-python = ">=3.10"
dependencies = [
    "pillow>=11,<13",
    "pydantic>=2.13.5,<3",
    "pymupdf>=1.25,<2",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
test = [
    "black>=25,<26",
    "pytest>=9,<10",
]
yolo26 = [
    "huggingface-hub>=0.23,<2",
    "ultralytics>=8.4,<9",
]
yolo11 = [
    "huggingface-hub>=0.23,<2",
    "ultralytics>=8.4,<9",
]
doclayoutyolo = [
    "doclayout-yolo==0.0.4",
    "huggingface-hub>=0.23,<2",
]
metadata = [
    "openai>=2.53,<3",
    "python-dotenv>=1,<2",
]
tfid = [
    "accelerate>=1,<2",
    "einops>=0.8,<1",
    "huggingface-hub>=0.23.2,<1",
    "timm>=1,<2",
    "transformers==4.46.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_snapshot_pipeline.metadata_extraction" = ["config/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
